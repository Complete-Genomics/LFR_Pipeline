samples:
    ########### start fill ###
    # list of lanes to use. format as fastq/V350094071_L04, leave blank if start from split.read.fq.gz,
    # in the format of *_1.fq.gz
    lanes: [V350132145]
    name: "V350132145"
    ########### end fill ###

    # specifies expected location of split reads [data/split_read.1.fq.gz, data/split_read.2.fq.gz] for PE
    # SE read treated as read2
    fastq: [data/split_read.1.fq.gz, data/split_read.2.fq.gz]
    # path for reads.fq.gz before splitting, leave blank if start from split.read.fq.gz,
    fq_path: "../fastq"
    # sample or id to use for generating targets
    id: "data"
    # Chromosomes to evaluate for fragment length and phasing
    # For mRNA/cDNA leave empty; cLFR may include ERCC spike-ins
    chroms: [chr1, chr2, chr3, chr4, chr5, chr6, chr7, chr8, chr9, chr10, chr11, chr12, chr13, chr14, chr15, chr16, chr17, chr18, chr19, chr20, chr21, chr22, chrX, chrY]
    # cLFR with ERCC: add ERCC-00130, ERCC-00096, ERCC-00116, ERCC-00025

modules:
    ### start fill ### for standard analysis set True: BCsplit, mapping, eval_metrics
    BCsplit: True
    mapping: True
    eval_metrics: True
    # stLFR fragment analyses
    LFR: False                   # stLFR: True
    # stLFR BC+gDNA mode (overrides other modules)
    BCgDNA: False
    variant_calling: False
    phasing: False
    benchmarking: False
    # cLFR-specific modules
    exon2fasta: False
    consensus_fasta: False
    # Shadow-only resource recommendations from completed benchmark history.
    # It never changes rule threads, memory, or runtime requests.
    resource_allocation: False
    # cLFR SE600: library composition vs GENCODE (protein_coding / lncRNA / rRNA / globin ...), modules/clfr/align/genecode.smk.
    # Additive and independent of mrna_mapper; set mapping/consensus_fasta False for a composition-only run.
    genecode: True
    rna_16s: False               # mode: 'frag_denovo' or 'align_ref'
    frag_de_novo: False
    ### end fill ###
    # canary: molecule-linkage SNP confidence re-scoring, downstream of variant_calling.
    # Produces an ADDITIONAL polished VCF alongside the primary GATK output -- does not
    # replace or gate anything else. Off by default; requires variant_calling: True.
    vc_polish: False

    mate_pair_analysis: False
    read_overlap_analysis: False
    duplicate_plot: False

params:
    ########### start fill ###
    # min reads per barcode/UMI; shared by consensus, denovo and genecode umi mode (25 = consensus threshold)
    reads_per_BC: 25
    downsample_ratio: 1.0
    batch_id: ""
    # Pass -T ref.fa to samtools consensus. Disabled by default because it can be slow.
    use_samtools_reference: False
    correct_rc: True
    # cLFR mRNA mapper is selected by read_len: <=150 uses HISAT2; >150 uses minimap2. gDNA uses BWA.
    # 'minimap2' -> map_reads_minimap (genome). GENCODE composition is a separate module: modules.genecode.
    mrna_mapper: 'minimap2'
    library_species: 'human'
    ref_id: ''
    # 'gdna' (map with BWA) or 'mrna' (map with STAR/minimap2)
    library_type: 'gdna'         # cLFR: 'mrna'
    sequence_type: 'pe'
    # stLFR: 'standard'; variants: 'standard_ac_swap', 'standard_gc_swap', 'pcrfree', 'BCgDNA'
    # cLFR: 'random_bc'; variants: 'random_bc_umi_rc', 'combined'
    bc_condition: 'standard'     # cLFR: 'random_bc'
    total_r2_len: 100            # cLFR: 185
    total_r1_len: 0
    bc_start: 0
    # stLFR BC length (42bp); set 0 for cLFR
    sbc_len: 42                  # cLFR: 0
    # cLFR random BC length (15bp); set 0 for stLFR
    cbc_len: 0                   # cLFR: 15
    gdna_start: 1
    read_len: 100                # cLFR: 150
    gdna_start_r1: 1
    read_len_r1: 100             # cLFR: 150
    additional_bc_start: 0
    additional_bc_len: 0
    additional_bc_len_r1: 0
    adapter_len: 0
    # cLFR random_bc / random_bc_umi_rc only. >1: cut the input into this many slices and run
    # split_barcode_LFR.py on all of them at once (split_barcode_LFR_parallel.py); outputs and
    # split_stat_read1.log are identical to a single run. 0 (or 1) = no slicing, single process.
    # Only worth it for very large inputs (~300G+); set e.g. 4 for those runs.
    # Needs free disk for the slices (~ one extra copy of R2) and threads >= split_parts.
    split_parts: 0
    # read pairs in the input; set it to skip the extra counting pass over R2 (0 = count)
    split_total_reads: 0
    ########### end fill ###

    splitNfq: 32
    is_fulllane_unfiltered: True
    bwa_mem: 'mem'
    gc_swap: False
    platform: "BGI-seq"
    barcode: "/barcode.list"
    barcode_RC: "/barcode_RC.list"
    barcode_GCswap: "/barcode.GCswap.list"
    barcode_RC_GCswap: "/barcode_RC.GCswap.list"
    enforced_bc_list: ""

    ref_fa: "hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa"
    ref_fa_mrna: "hg38/GRCh38_latest_rna.fna.ercc.fasta"
    ref_fa_other: "ref/other.fa"
    toolsdir: "CGI_WGS_Pipeline/Data_and_Tools"
    src_dir: "CGI_LFR_pipeline/"
    gatk_install: "gatk"
    calc_frag_python: "python"
    dbsnp_path: "dbsnp_138.hg38.chrfix.vcf.gz"
    gc_bias_index: "hg38/GCA_000001405.15_GRCh38_no_alt_analysis_set.fa.500.gc"
    rtg_install: "rtg"
    gcbias_python: "python"
    general_python: "python"
    tabix: "/opt/cgi-tools/bin/tabix"
    hapcut2: "hapcut2/bin"
    # default 1.18, /home/ycai/anaconda3/envs/samtools1.13/bin/samtools
    samtools: "samtools"
    bcftools: "/opt/cgi-tools/bin/bcftools"
    hapcut_link_dist: 100000
    wenlan_python: "/opt/cgi-anaconda2-4.4.0/bin/python"

    # mRNA mapper tools (required when library_type: 'mrna')
    star: "STAR"
    star_index: "star_index"
    hisat2: "hisat2"
    hisat2_index: "hisat2_index"
    hisat2_splicesites: "splicesites.txt"
    minimap2: "minimap2"
    minimap2_anno_bed: "anno.bed12"
    # Optional prebuilt indexes. Build minimap2_index with -x splice:sr and
    # minimap2_mrna_index with -x asm20; leave blank to use the FASTA directly.
    minimap2_index: ""
    minimap2_mrna_index: "/home/ycai/src/LFR_Pipeline/ref/genecode/gencode.v50.transcripts.fa.gz"   # consensus map_fasta_consensus (-x asm20) -> GENCODE; blank = ref_fa_mrna
    # ---- modules.genecode (modules/clfr/align/genecode.smk) ----
    # The combined reference (transcripts + rRNA + genome decoy) is sample-independent and is NOT built by the
    # workflow: run modules/clfr/align/build_genecode_ref.sh once (-t genecode_transcripts -r genecode_rrna_fa
    # -g genecode_genome); it writes gencode.v50.transcripts_rRNA_decoy.fa.gz next to genecode_transcripts, which
    # every sample reuses (genecode_ref picks another location). The workflow stops with a message if it is missing.
    # rRNA is largely absent from GENCODE: without the rRNA fasta (e.g. NCBI NR_046235 45S + NR_023363 5S)
    # rRNA reads cannot be counted; without the genome (GRCh38.primary_assembly, decoy) genomic/intronic
    # reads get forced onto transcripts.
    # Input: split + trimmed SE600 fastq. Blank = data/split_read_2_trimmed.fastq.gz (the pipeline's own split_reads +
    # trim_reads output, built on demand over the FULL library); on big data point this at a small pre-trimmed slice instead.
    genecode_trimmed_fq: ""
    genecode_ref: ""
    genecode_transcripts: "/home/ycai/src/LFR_Pipeline/ref/genecode/gencode.v50.transcripts.fa.gz"
    genecode_gtf: "/home/ycai/src/LFR_Pipeline/ref/genecode/gencode.v50.annotation.gtf.gz"   # gene_type per transcript
    genecode_rrna_fa: "/home/ycai/src/LFR_Pipeline/ref/genecode/human_rRNA.fa"
    genecode_genome: "/home/ycai/src/LFR_Pipeline/ref/genecode/GRCh38.primary_assembly.genome.fa.gz"
    # head (default): first N reads, fast (stops early) but depends on file order.
    # random: seqtk read sampling over the whole file, unbiased for read-level %, slow on huge fq.
    # umi: sample whole UMIs (all reads of each kept; set explicitly, needed for UMI-level %; one full awk pass).
    genecode_subsample_mode: "head"
    genecode_umi_n: 50000              # umi mode: UMIs to sample
    genecode_subsample_reads: 400000   # head/random mode: reads to keep
    genecode_subsample_seed: 100
    # minimap2 -N: max secondary alignments kept per read. Needed to see reads that hit several classes (ambiguous):
    # on the test data ambiguous was 2.84% at 5, 3.79% at 10, 4.79% at 20, 4.99% at 50 (20 ~ plateau, 30% fewer records)
    genecode_max_hits: 20
    genecode_min_cov: 0.5   # best hit must cover >= this fraction of the read, else low_cov (0.8 was too strict for SE600 3' quality decay)
    # samtools sort memory limit per sorting/compression thread.
    minimap_sort_mem: "8G"

    # denovo assembly tools (required when modules.frag_de_novo: True)
    megahit: "megahit"
    bbduk: "bbduk.sh"
    # additional trim on adapter183 for clfr mrna lib
    adapter_ref_5p: True
    # additional trim on the cLFR SE600 3' linker (GTATCTGAGTCC)
    adapter_ref_3p: True
    # k-mer length for the adapter_ref (MGI forward/reverse filter) pass; default 23, 18 for SE600
    adapter_ref_k: 18
    # >0: strip poly-A/T tails of at least this length after adapter trimming (0 = off)
    trim_polya: 0
    # quality trim of the main trim_reads pass: bbduk qtrim=rl trimq (6 = bbduk default). Pick per batch with
    # src/tools/qc_quality_scan.py (it prints the values to use)
    trim_q: 6
    # discard reads whose average quality after trimming is below this (bbduk maq); 0 = off
    trim_maq: 0
    # Per-batch trim switches (replace a hand-written trim.sh; the values shown = the previous hard-coded behaviour):
    # false = skip the 3' MGI adapter k-mer pass (adapter_ref / adapter_ref_k)
    trim_mgi_adapter: true
    # false = no quality trimming at all (trim_q ignored)
    trim_qtrim: false
    # restrictleft of the 5' adapter183 pass (adapter_ref_5p): must cover where adapter183 sits.
    # 30 = old value; 40 for split SE600 reads (adapter183 spans pos 6-30); 70 for RAW 625 bp reads
    trim_5p_restrict_left: 30
    # bbduk minlen: reads shorter than this after trimming are dropped (SE600 601/694 used 36)
    trim_minlen: 10
    # maxns of the main pass: drop reads with more N than this, -1 = off. Default: 0 for SE, off for PE
    # trim_maxns: 0
    bgzip: "bgzip"
    # reference-free chimera detection for OLC post-assembly QC (no curated
    # reference DB in production -- see denovo_olc.smk's readbackQC_olc/
    # chimeraQC_olc/combineQC_olc and denovo.md sec 26/29)
    vsearch: "vsearch"
    # ERCC spike-in analysis (required when running ercc_count/ercc_plot)
    featurecounts: "featureCounts"
    ercc_gtf: "ERCC92.gtf"
    ercc_ref_gc: "ercc_ref_gc.txt"

    # exon2fasta combined-BC mode (required when bc_condition: 'combined')
    jvarkit_samjdk: "samjdk.jar"

    # Mandalorion/SQANTI3 (required when modules.consensus_fasta: True)
    mandalorion: "Mando.py"
    mandalorion_python: "python"
    mandalorion_gtf: "gencode.annotation.gtf"
    mandalorion_ref: "genome.fa"
    sqanti3_script: "sqanti3_qc.py"
    sqanti3_python: "python"
    sqanti3_cage_peak: "human.refTSS.bed"
    sqanti3_polyA_motif: "polyA_motif.txt"

calc_frag:
    ########### start fill ###
    # stLFR defaults: minreads=4, mapping_quality=30
    # cLFR defaults: minreads=100, mapping_quality=0
    minreads: 'default'
    mapping_quality: 'default'
    min_frag: 500
    minreads_fasta: 100
    calc_bc_condition: ''
    ########### end fill ###

    n_tolerance: 2
    split_dist: [50000]
    include_dups: True
    ray_mem: "200,1024,100,1024"
    writeouttsvs: True
    num_bin_in_frag: 10
    ylim: 50

frag_de_novo:
    ## olc or megahit
    assembler: olc   # megahit | olc (pure-Python OLC, no subprocess fork)
    assembly_N_umi: 1000    # empty = denovo all UMIs; set an int to cap for debug/smoke test
    run_parallel: False
    margin: 5
    spades: "spades.py"
    spades_phred_offset: 55
    quast_dir: "quast.py"
    quast_min_contig: 100
    quast_space_efficient: True
    minimap: "minimap2"
    denovo_type: 'correct_rc'
    end_idx:
    start_idx: 0
    tmp_dir: /dev/shm
    sort_mem: 4G
    sort_tmp_dir: denovo/tmp_sort
    flank_end: 30
    adapter_seq: "CTCAGCAGAGGG"
    min_ctg_len: 400
    num_processes: 20

umi:
    umi_pos_strand_batch: ""

# Build history with resource_allocation.py collect from benchmark files and a
# task manifest. Candidates are pre-submit rows with stable task_key, rule,
# input_size_bytes, static_memory_gb, and static_runtime_min. Leave disabled
# until history spans multiple independent runs; unknown/OOD rows fall back to
# their static request.
resource_allocation:
    history: ""
    candidates: ""
    shadow_output: "resource_allocation/shadow.tsv"
    quantile: 0.95
    memory_margin: 1.30
    runtime_margin: 1.25
    min_rule_samples: 20
    min_bucket_samples: 10

# vc_polish (canary, modules.vc_polish must be True): molecule-linkage confidence
# re-scoring of called SNPs (cLFR_eval Claim A model). model/editing_bed empty ->
# vc_polish.smk falls back to the model shipped in modules/clfr/vc_polish/models/.
vc_polish:
    model: ""       # override to point at a different model.txt; "" = use the shipped default
    threshold: 0.5  # KEEP if p_true >= threshold, else REVERT
    editing_bed: ""  # optional REDIportal-style BED of RNA-editing sites (A>G/T>C never reverted)

benchmark:
    benchmark_snp: "hg38_GIAB_HG001/benchmark_snp.chrfix.vcf.gz"
    benchmark_indel: "hg38_GIAB_HG001/benchmark_indel.chrfix.vcf.gz"
    bedfile: "hg38_GIAB_HG001/benchmark_bed.chrfix.bed"
    ref_sdf: "hg38_benchmark_ref/GRCh38.sdf"
    # /mnt/qnap-archive/ycai/src/master/dev/CGI_WGS_Pipeline/Data_and_Tools/data/hg38_GIAB_HG002
    truth_vcf_dir: ""
    vcf_benchmark: ""

threads:
    bwa: 100
    # 32-CPU mapping budget: minimap_map + minimap_sort must not exceed
    # minimap_total. Keep the remaining host CPUs available to the OS/I/O.
    minimap_total: 38
    minimap_map: 30
    minimap_sort: 6
    consensus_index: 8
    consensus_name_sort: 2
    consensus_minimap: 20
    haplotyper: 100
    metrics: 10
    gnu_parallel: 20
    calc_frag: 4
    split_group: 80
    quast: 4
    supernova: 100
    vc_polish: 4
